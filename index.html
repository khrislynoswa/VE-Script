<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Script sa VALUES</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    #f1dfff 0%,
                    #dfc2ed 45%,
                    #cda8df 100%
                );
        }


        /* =========================
           BIRTHDAY MESSAGE
        ========================= */

        #birthday {
            position: fixed;

            top: 7%;
            left: 50%;

            transform: translateX(-50%);

            display: none;

            color: #7b3f98;

            font-size: clamp(32px, 6vw, 65px);

            font-weight: 800;

            line-height: 1.05;

            letter-spacing: 2px;

            text-align: center;

            text-shadow:
                0 4px 15px rgba(123, 63, 152, .25);

            z-index: 50;

            white-space: nowrap;
        }


        #birthday.show {
            display: block;

            animation:
                birthdayAppear
                1.2s
                cubic-bezier(.2, 1.4, .4, 1)
                forwards;
        }


        @keyframes birthdayAppear {

            0% {
                opacity: 0;
                transform:
                    translate(-50%, -30px)
                    scale(.7);
            }

            70% {
                transform:
                    translate(-50%, 5px)
                    scale(1.08);
            }

            100% {
                opacity: 1;
                transform:
                    translate(-50%, 0)
                    scale(1);
            }

        }


        /* =========================
           CAKE WRAPPER
        ========================= */

        .cake-wrapper {

            position: relative;

            width: 620px;
            max-width: 90vw;

            height: 440px;

            display: flex;

            justify-content: center;

            align-items: flex-end;

            margin-top: 100px;
        }


        .cake-shadow {

            position: absolute;

            bottom: 8px;

            width: 500px;
            height: 35px;

            background:
                rgba(108, 53, 128, .18);

            border-radius: 50%;

            filter: blur(10px);
        }


        .cake {

            position: relative;

            width: 460px;
            height: 270px;

            z-index: 5;
        }


        /* =========================
           CAKE LAYERS
        ========================= */

        .layer-bottom {

            position: absolute;

            bottom: 20px;
            left: 50%;

            transform: translateX(-50%);

            width: 460px;
            height: 115px;

            border-radius:
                20px 20px 35px 35px;

            background:
                linear-gradient(
                    180deg,
                    #ef91ba 0%,
                    #dc6fa1 100%
                );

            box-shadow:
                inset 0 8px 0 rgba(255,255,255,.25),
                0 12px 20px rgba(104,45,119,.2);
        }


        .layer-middle {

            position: absolute;

            bottom: 110px;
            left: 50%;

            transform: translateX(-50%);

            width: 410px;
            height: 90px;

            border-radius:
                18px 18px 25px 25px;

            background:
                linear-gradient(
                    180deg,
                    #f7b6d3 0%,
                    #ec91ba 100%
                );

            box-shadow:
                inset 0 7px 0 rgba(255,255,255,.3);
        }


        .layer-top {

            position: absolute;

            bottom: 180px;
            left: 50%;

            transform: translateX(-50%);

            width: 350px;
            height: 75px;

            border-radius:
                18px 18px 22px 22px;

            background:
                linear-gradient(
                    180deg,
                    #fbd2e3 0%,
                    #f4aecb 100%
                );

            box-shadow:
                inset 0 7px 0 rgba(255,255,255,.35),
                0 5px 10px rgba(100,50,120,.12);
        }


        /* =========================
           FROSTING
        ========================= */

        .frosting {

            position: absolute;

            left: 50%;

            transform: translateX(-50%);

            width: 355px;
            height: 35px;

            bottom: 220px;

            background: #fff0f7;

            border-radius: 20px;

            box-shadow:
                0 4px 8px rgba(110,50,120,.12);
        }


        .drip {

            position: absolute;

            width: 28px;
            height: 42px;

            background: #fff0f7;

            border-radius:
                0 0 18px 18px;

            bottom: -20px;
        }


        .drip:nth-child(1) {
            left: 45px;
            height: 35px;
        }


        .drip:nth-child(2) {
            left: 110px;
            height: 50px;
        }


        .drip:nth-child(3) {
            left: 180px;
            height: 30px;
        }


        .drip:nth-child(4) {
            left: 245px;
            height: 45px;
        }


        /* =========================
           CAKE DETAILS
        ========================= */

        .decoration {

            position: absolute;

            bottom: 58px;

            left: 50%;

            transform: translateX(-50%);

            display: flex;

            gap: 55px;
        }


        .dot {

            width: 15px;
            height: 15px;

            border-radius: 50%;

            background: #ead7ff;

            box-shadow:
                0 2px 5px rgba(80,40,100,.2);
        }


        /* =========================
           CANDLES
        ========================= */

        .candles {

            position: absolute;

            top: -5px;
            left: 50%;

            transform: translateX(-50%);

            width: 430px;

            display: flex;

            justify-content: center;

            align-items: flex-end;

            gap: 8px;

            z-index: 10;
        }


        .candle {

            position: relative;

            width: 18px;
            height: 75px;

            border-radius:
                8px 8px 5px 5px;

            background:
                repeating-linear-gradient(
                    90deg,
                    #ead7ff 0px,
                    #ead7ff 7px,
                    #d9baff 7px,
                    #d9baff 12px
                );

            box-shadow:
                inset 2px 0 3px rgba(255,255,255,.5),
                2px 4px 6px rgba(90,40,110,.15);

            animation:
                candleSway
                1.4s
                ease-in-out
                infinite
                alternate;
        }


        .candle:nth-child(2n) {
            animation-delay: -.4s;
        }


        .candle:nth-child(3n) {
            animation-delay: -.8s;
        }


        @keyframes candleSway {

            from {
                transform: rotate(-2.5deg);
            }

            to {
                transform: rotate(2.5deg);
            }

        }


        /* =========================
           FLAMES
        ========================= */

        .flame {

            position: absolute;

            width: 19px;
            height: 30px;

            left: 50%;
            top: -30px;

            transform:
                translateX(-50%)
                rotate(45deg);

            border-radius:
                60% 40% 60% 40%;

            background:
                linear-gradient(
                    135deg,
                    #fff4a8,
                    #ffb52e 55%,
                    #ff7a18
                );

            box-shadow:
                0 0 12px #ffb52e,
                0 0 25px rgba(255,157,30,.6);

            animation:
                flicker
                .25s
                infinite
                alternate;
        }


        .flame::after {

            content: "";

            position: absolute;

            width: 8px;
            height: 14px;

            background: #fff8cf;

            border-radius: 50%;

            left: 3px;
            top: 5px;
        }


        @keyframes flicker {

            from {
                transform:
                    translateX(-50%)
                    rotate(40deg)
                    scale(.9);
            }

            to {
                transform:
                    translateX(-50%)
                    rotate(50deg)
                    scale(1.12);
            }

        }


        .flame.off {
            animation:
                extinguish
                .35s
                forwards;
        }


        @keyframes extinguish {

            0% {
                opacity: 1;

                transform:
                    translateX(-50%)
                    scale(1);
            }

            100% {
                opacity: 0;

                transform:
                    translateX(-50%)
                    translateY(-25px)
                    scale(.1);
            }

        }


        /* =========================
           CONFETTI
        ========================= */

        .confetti {

            position: fixed;

            left: 50%;
            top: 45%;

            width: 10px;
            height: 18px;

            z-index: 100;

            pointer-events: none;

            animation:
                confettiFly
                2.8s
                cubic-bezier(.1,.7,.3,1)
                forwards;
        }


        @keyframes confettiFly {

            0% {

                transform:
                    translate(-50%, -50%)
                    rotate(0deg)
                    scale(0);

                opacity: 1;
            }


            15% {

                opacity: 1;

                transform:
                    translate(
                        calc(-50% + var(--x) * .25),
                        calc(-50% + var(--y) * .25)
                    )
                    rotate(120deg)
                    scale(1);
            }


            100% {

                opacity: 0;

                transform:
                    translate(
                        calc(-50% + var(--x)),
                        calc(-50% + var(--y) + 500px)
                    )
                    rotate(900deg)
                    scale(.8);
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .cake-wrapper {
                transform: scale(.68);
                margin-top: 100px;
            }


            #birthday {

                font-size: 27px;

                top: 7%;
            }

        }

    </style>

</head>


<body>


    <!-- BIRTHDAY MESSAGE -->

    <h1 id="birthday">

        HAPPY BIRTHDAY<br>

        ANGELIQUE 🎂

    </h1>


    <!-- CAKE -->

    <div class="cake-wrapper">

        <div class="cake-shadow"></div>


        <div class="cake">


            <!-- 14 CANDLES -->

            <div class="candles">

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

            </div>


            <!-- CAKE LAYERS -->

            <div class="layer-top"></div>

            <div class="frosting">

                <div class="drip"></div>
                <div class="drip"></div>
                <div class="drip"></div>
                <div class="drip"></div>

            </div>

            <div class="layer-middle"></div>

            <div class="layer-bottom"></div>


            <!-- CAKE DECORATIONS -->

            <div class="decoration">

                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>

            </div>

        </div>

    </div>
    <p class="blow-text">Blow the Candle</p>

    <script>


        let alreadyBlown = false;


        /* =========================
           AUTOMATIC MICROPHONE
        ========================= */

        window.addEventListener("load", function () {

            if (!navigator.mediaDevices) {
                return;
            }


            navigator.mediaDevices
                .getUserMedia({
                    audio: true
                })

                .then(function (stream) {

                    const audio =
                        new (
                            window.AudioContext ||
                            window.webkitAudioContext
                        )();


                    const microphone =
                        audio.createMediaStreamSource(
                            stream
                        );


                    const analyser =
                        audio.createAnalyser();


                    analyser.fftSize = 512;

                    analyser.smoothingTimeConstant = 0.25;


                    microphone.connect(analyser);


                    const data =
                        new Uint8Array(
                            analyser.fftSize
                        );


                    let loudFrames = 0;


                    function detectBlow() {

                        if (alreadyBlown) {
                            return;
                        }


                        analyser.getByteTimeDomainData(
                            data
                        );


                        let total = 0;


                        for (
                            let i = 0;
                            i < data.length;
                            i++
                        ) {

                            const value =
                                data[i] - 128;


                            total +=
                                value * value;

                        }


                        const volume =
                            Math.sqrt(
                                total / data.length
                            );


                        if (volume > 18) {

                            loudFrames++;

                        }

                        else {

                            loudFrames = 0;

                        }


                        if (loudFrames >= 4) {

                            blowCandles();

                            return;

                        }


                        requestAnimationFrame(
                            detectBlow
                        );

                    }


                    detectBlow();

                })


                .catch(function () {

                    console.log(
                        "Microphone permission was not allowed."
                    );

                });

        });


        /* =========================
           BLOW CANDLES
        ========================= */

        function blowCandles() {

            if (alreadyBlown) {
                return;
            }


            alreadyBlown = true;


            const flames =
                document.querySelectorAll(
                    ".flame"
                );


            flames.forEach(
                function (flame, index) {

                    setTimeout(
                        function () {

                            flame.classList.add(
                                "off"
                            );

                        },
                        index * 35
                    );

                }
            );


            setTimeout(
                function () {

                    const birthday =
                        document.getElementById(
                            "birthday"
                        );


                    birthday.style.display =
                        "block";


                    birthday.classList.add(
                        "show"
                    );


                    createConfetti();

                },
                500
            );

        }


        /* =========================
           CONFETTI BURST
        ========================= */

        function createConfetti() {

            const pieces = 150;


            for (
                let i = 0;
                i < pieces;
                i++
            ) {

                const confetti =
                    document.createElement(
                        "div"
                    );


                confetti.className =
                    "confetti";


                const angle =
                    Math.random() *
                    Math.PI * 2;


                const distance =
                    150 +
                    Math.random() * 550;


                const x =
                    Math.cos(angle) *
                    distance;


                const y =
                    Math.sin(angle) *
                    distance;


                confetti.style.setProperty(
                    "--x",
                    x + "px"
                );


                confetti.style.setProperty(
                    "--y",
                    y + "px"
                );


                const size =
                    6 +
                    Math.random() * 10;


                confetti.style.width =
                    size + "px";


                confetti.style.height =
                    size * 1.7 + "px";


                confetti.style.background =
                    randomColor();


                confetti.style.animationDelay =
                    Math.random() * .35 + "s";


                document.body.appendChild(
                    confetti
                );


                setTimeout(
                    function () {

                        confetti.remove();

                    },
                    3500
                );

            }

        }


        /* =========================
           CONFETTI COLORS
        ========================= */

        function randomColor() {

            const colors = [

                "#ff6fae",
                "#c77dff",
                "#9d4edd",
                "#ffd166",
                "#ffffff",
                "#ff9fca",
                "#b8a0ff"

            ];


            return colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];

        }

    </script>


</body>

</html>
